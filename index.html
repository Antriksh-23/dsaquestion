        </main>
        
        <footer class="mt-8 text-center text-gray-500 text-sm">
            Progress is automatically saved to your browser.

        // State
        let activeCategory = Object.keys(dsaData)[0];
        let savedProgress = JSON.parse(localStorage.getItem('dsaProgress')) || {};
        let totalProblems = 0;
        
        // Difficulty weights for sorting
        const diffWeights = { "Easy": 1, "Medium": 2, "Hard": 3 };

        // Preprocess Data: Sort by difficulty and renumber sequentially
        for (const cat in dsaData) {
            dsaData[cat].sort((a, b) => diffWeights[a.diff] - diffWeights[b.diff]);
            dsaData[cat].forEach((prob, index) => {
                prob.num = index + 1;
            });
        }

        // Calculate Total
        for (const cat in dsaData) {
            totalProblems += dsaData[cat].length;
        }

        // Difficulty Badge Styles
        const badgeColors = {
            "Easy": "bg-green-500/10 text-green-400 border-green-500/20",
            "Medium": "bg-yellow-500/10 text-yellow-400 border-yellow-500/20",
            "Hard": "bg-red-500/10 text-red-400 border-red-500/20"
        };

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            renderTabs();
            renderTable(activeCategory);
            updateProgress();
        });

        function renderTabs() {
            const tabsContainer = document.getElementById('category-tabs');
            tabsContainer.innerHTML = '';

            Object.keys(dsaData).forEach(cat => {
                const btn = document.createElement('button');
                const isActive = cat === activeCategory;
                
                btn.className = `whitespace-nowrap px-4 py-2.5 rounded-xl font-medium transition-all duration-200 text-sm ${
                    isActive 
                    ? 'bg-indigo-600 text-white shadow-md shadow-indigo-900/50' 
                    : 'bg-gray-800 text-gray-400 hover:bg-gray-700 hover:text-gray-200'
                }`;
                btn.textContent = cat;
                
                btn.onclick = () => {
                    activeCategory = cat;
                    renderTabs();
                    renderTable(activeCategory);
                    updateProgress();
                };
                
                tabsContainer.appendChild(btn);
            });
        }

        function renderTable(category) {
            const tbody = document.getElementById('table-body');
            
            // Trigger animation restart
            tbody.classList.remove('fade-in');
            void tbody.offsetWidth; // trigger reflow
            tbody.classList.add('fade-in');

            tbody.innerHTML = '';

            dsaData[category].forEach(prob => {
                const id = `${category.replace(/[^a-zA-Z0-9]/g, '')}_${prob.num}`;
                const isChecked = savedProgress[id] || false;
                const badgeClass = badgeColors[prob.diff] || 'bg-gray-700 text-gray-300';
                
                // Use explicit slug for accurate URLs
                const slug = prob.slug;

                const tr = document.createElement('tr');
                tr.className = `hover:bg-gray-750/50 transition-colors group ${isChecked ? 'bg-indigo-900/10' : ''}`;
                tr.id = `row_${id}`;

                tr.innerHTML = `
                    <td class="px-6 py-4 text-center">
                        <label class="flex items-center justify-center cursor-pointer">
                            <input type="checkbox" 
                                   id="chk_${id}" 
                                   class="w-5 h-5 rounded border-gray-600 bg-gray-700 text-indigo-500 focus:ring-indigo-500 focus:ring-offset-gray-900 cursor-pointer transition-transform group-hover:scale-110"
                                   ${isChecked ? 'checked' : ''}
                                   onchange="toggleDone('${id}', this.checked)">
                        </label>
                    </td>
                    <td class="px-6 py-4 text-gray-400 font-mono text-sm">${prob.num}</td>
                    <td class="px-6 py-4">
                        <a href="https://leetcode.com/problems/${slug}/" target="_blank" rel="noopener noreferrer" id="title_${id}" class="font-medium transition-all ${isChecked ? 'line-through text-gray-500' : 'text-blue-400 hover:text-blue-300 hover:underline'}">
                            ${prob.title}
                        </a>
                    </td>
                    <td class="px-6 py-4">
                        <span class="px-2.5 py-1 text-xs font-semibold rounded-md border ${badgeClass}">
                            ${prob.diff}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-400 hidden md:table-cell">
                        ${prob.pattern}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function toggleDone(id, isChecked) {
            // Update local state
            if (isChecked) {
                savedProgress[id] = true;
            } else {
                delete savedProgress[id];
            }
            
            // Save to localStorage
            localStorage.setItem('dsaProgress', JSON.stringify(savedProgress));
            
            // Update visuals for specific row
            const titleSpan = document.getElementById(`title_${id}`);
            const row = document.getElementById(`row_${id}`);
            
            if (isChecked) {
                titleSpan.classList.add('line-through', 'text-gray-500');
                titleSpan.classList.remove('text-blue-400', 'hover:text-blue-300', 'hover:underline');
                row.classList.add('bg-indigo-900/10');
            } else {
                titleSpan.classList.remove('line-through', 'text-gray-500');
                titleSpan.classList.add('text-blue-400', 'hover:text-blue-300', 'hover:underline');
                row.classList.remove('bg-indigo-900/10');
            }

            // Update overall and category progress
            updateProgress();
        }

        function updateProgress() {
            // Global Progress
            const completed = Object.keys(savedProgress).length;
            const percentage = Math.round((completed / totalProblems) * 100) || 0;
            
            document.getElementById('progress-text').textContent = `${completed} / ${totalProblems} (${percentage}%)`;
            document.getElementById('progress-bar').style.width = `${percentage}%`;

            // Category Progress
            if (activeCategory) {
                const catProblems = dsaData[activeCategory];
                const catTotal = catProblems.length;
                let catCompleted = 0;
                
                catProblems.forEach(prob => {
                    const id = `${activeCategory.replace(/[^a-zA-Z0-9]/g, '')}_${prob.num}`;
                    if (savedProgress[id]) {
                        catCompleted++;
                    }
                });
                
                const catPercentage = Math.round((catCompleted / catTotal) * 100) || 0;
                document.getElementById('category-title').textContent = activeCategory;
                document.getElementById('category-progress-text').textContent = `${catCompleted} / ${catTotal} (${catPercentage}%)`;
                document.getElementById('category-progress-bar').style.width = `${catPercentage}%`;
            }
        }
    </script>
</body>
</html>
